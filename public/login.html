
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Instant Democracy</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="auth-body">

    <!-- SHARED HEADER -->
    <header class="header">

        <button
            class="icon-button"
            id="menuButton"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="sidebar"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <a href="index.html" class="logo">
            INSTANT<span>DEMOCRACY</span>
        </a>

        <div class="account-container">

            <button
                class="account-button"
                id="accountButton"
                type="button"
                aria-label="Open account menu"
                aria-expanded="false"
                aria-controls="accountDropdown"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
                </svg>
            </button>

            <div class="account-dropdown" id="accountDropdown">
                <a href="login.html">Sign in</a>
                <a href="register.html">Create account</a>
            </div>

        </div>

    </header>

    <!-- SHARED SIDE MENU -->
    <div class="overlay" id="overlay"></div>

    <nav
        class="sidebar"
        id="sidebar"
        aria-label="Main navigation"
    >

        <div class="sidebar-header">

            <h2>Explore</h2>

            <button
                class="close-button"
                id="closeMenu"
                type="button"
                aria-label="Close navigation menu"
            >
                &times;
            </button>

        </div>

        <a href="index.html" class="nav-link">
            Home
        </a>

        <a href="debates.html" class="nav-link">
            Debates
        </a>

        <a href="createProposal.html" class="nav-link">
            Create a Proposal
        </a>

        <a href="vote.html" class="nav-link">
            Vote
        </a>

        <a href="approvedProposals.html" class="nav-link">
            Approved Proposals
        </a>

        <a href="notPassedProposals.html" class="nav-link">
            Unsuccessful Proposals
        </a>

    </nav>

    <!-- LOGIN CONTENT -->
    <main class="auth-page">

        <section class="auth-panel" aria-labelledby="loginTitle">

            <!-- LOGIN / CREATE ACCOUNT -->
            <nav class="auth-tabs" aria-label="Account access">

                <a
                    href="login.html"
                    class="auth-tab auth-tab--active"
                    aria-current="page"
                >
                    LOGIN
                </a>

                <span class="auth-tab-divider" aria-hidden="true">
                    /
                </span>

                <a
                    href="register.html"
                    class="auth-tab"
                >
                    CREATE ACCOUNT
                </a>

            </nav>

            <!-- INTRODUCTION -->
            <div class="auth-intro">

                <span class="auth-eyebrow">
                    WELCOME BACK
                </span>

                <h1 id="loginTitle">
                    Sign in to your account
                </h1>

                <p>
                    Access your account and take part
                    in your university community.
                </p>

            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="auth-form">

                <div class="auth-field">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        maxlength="254"
                        required
                    >

                </div>

                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <!-- LOGIN ERROR / STATUS -->
                <p
                    id="loginMessage"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="auth-submit"
                    id="loginSubmit"
                >
                    Sign in
                </button>

            </form>

            <!-- CREATE ACCOUNT LINK -->
            <p class="auth-bottom-link">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
